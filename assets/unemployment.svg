<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background card -->
  <rect x="6" y="8" width="52" height="42" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="12" y1="38" x2="52" y2="38" stroke="#90caf9" stroke-width="1"/>
  <line x1="12" y1="28" x2="52" y2="28" stroke="#90caf9" stroke-width="1"/>
  <line x1="12" y1="18" x2="52" y2="18" stroke="#90caf9" stroke-width="1"/>
  <!-- Line chart going up then spiking -->
  <polyline points="12,38 20,35 28,34 34,32 40,22 48,16" fill="none" stroke="#f44336" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots -->
  <circle cx="12" cy="38" r="2.5" fill="#f44336"/>
  <circle cx="20" cy="35" r="2.5" fill="#f44336"/>
  <circle cx="28" cy="34" r="2.5" fill="#f44336"/>
  <circle cx="34" cy="32" r="2.5" fill="#f44336"/>
  <circle cx="40" cy="22" r="2.5" fill="#f44336"/>
  <circle cx="48" cy="16" r="3" fill="#b71c1c"/>
  <!-- X-axis -->
  <line x1="12" y1="44" x2="52" y2="44" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Y-axis -->
  <line x1="12" y1="12" x2="12" y2="44" stroke="#1565c0" stroke-width="1.5"/>
  <!-- COVID label arrow -->
  <line x1="40" y1="22" x2="48" y2="16" stroke="#b71c1c" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Person icons at bottom -->
  <circle cx="24" cy="56" r="3" fill="#1565c0"/>
  <path d="M21 62 Q24 58 27 62" stroke="#1565c0" stroke-width="1.5" fill="none"/>
  <circle cx="40" cy="56" r="3" fill="#90caf9"/>
  <path d="M37 62 Q40 58 43 62" stroke="#90caf9" stroke-width="1.5" fill="none"/>
</svg>
